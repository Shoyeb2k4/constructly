# Android release identity — the single source of truth.
#
# versionCode  MONOTONIC INTEGER. Google Play rejects an upload whose code is
#              not strictly greater than every code already in the track, and a
#              code can never be reused, even after a rollback. Bump it for
#              every artifact you intend to distribute — including a rebuild of
#              the "same" version.
# versionName  Human-facing string. Shown in Play and in Settings → Apps. Not
#              parsed by Play; it may repeat across builds.
#
# Kept out of build.gradle so a release bump is a one-line, reviewable diff that
# never risks touching build logic, and so CI can bump it mechanically.
versionCode=1
versionName=1.0.0
